name: Verify

on:
  pull_request:
  push:
    branches: [main, add-usdc-usdt-payments]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install storefront dependencies
        run: npm install --no-audit --no-fund

      - name: Install MCP dependencies
        run: npm install --prefix mcp --no-audit --no-fund

      - name: Create isolated Wrangler configuration
        run: |
          sed \
            -e 's/__NAME__/minshop-check/g' \
            -e 's/__DB_NAME__/minshop-check-db/g' \
            -e 's/__DB_ID__/00000000-0000-0000-0000-000000000000/g' \
            -e 's/__BUCKET__/minshop-check-images/g' \
            -e 's/__FILES_BUCKET__/minshop-check-files/g' \
            wrangler.template.jsonc > wrangler.jsonc

      - name: Run complete verification
        run: npm run verify

  discover:
    name: Discover themes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      themes: ${{ steps.discover.outputs.themes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: List themes not covered by the main job
        id: discover
        run: |
          themes=$(node --input-type=module -e "
            import { discoverThemeIds, resolveConfiguredTheme } from './scripts/themes.mjs';
            const configured = resolveConfiguredTheme().id;
            console.log(JSON.stringify(discoverThemeIds().filter((id) => id !== configured)));
          ")
          echo "discovered: $themes"
          echo "themes=$themes" >> "$GITHUB_OUTPUT"

  themes:
    name: Verify theme (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: discover
    if: needs.discover.outputs.themes != '[]'
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.discover.outputs.themes) }}
    env:
      THEME: ${{ matrix.theme }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install storefront dependencies
        run: npm install --no-audit --no-fund
      - name: Create isolated Wrangler configuration
        run: |
          sed \
            -e 's/__NAME__/minshop-check/g' \
            -e 's/__DB_NAME__/minshop-check-db/g' \
            -e 's/__DB_ID__/00000000-0000-0000-0000-000000000000/g' \
            -e 's/__BUCKET__/minshop-check-images/g' \
            -e 's/__FILES_BUCKET__/minshop-check-files/g' \
            wrangler.template.jsonc > wrangler.jsonc
      - name: Verify the theme builds and honours the contract
        run: npm run verify:theme

  deploy:
    name: Deploy production to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify, themes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && (needs.themes.result == 'success' || needs.themes.result == 'skipped')
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install storefront dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production storefront
        run: npm run build

      - name: Apply production D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply minshop-db --remote

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
