name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    name: Build, migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Validate Cloudflare credentials
        run: npx wrangler whoami

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply minshop-db --remote

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy

      - name: Smoke test production URL
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_URL is not configured; deployment itself succeeded."
            exit 0
          fi
          echo "Testing $PRODUCTION_URL"
          curl --fail --silent --show-error --location --max-time 30 "$PRODUCTION_URL" > /tmp/home.html
          grep -qi '<html' /tmp/home.html
          echo "Production homepage smoke test passed."